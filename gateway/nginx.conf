# =====================================================================
#  MyAntFarm-Extended gateway: ONE Nginx doing load balancing at every tier
#
#   :80     public   /        the Side B record shop (static) -> /shop-api on web1..web3
#                    /ops/    the ops console (incident response dashboard)
#                    /api/multi (coordinators), /api/single (copilot)
#                    /chaos/<service>/down|up  fault-injection switch
#                    /lb/status
#   :8080   public   the demo website, load balanced over web1..web3
#   :8090   internal agent tier (one upstream per specialist role)
#   :11434  internal LLM tier, load balanced over ollama1..ollama2
#
#  `resolve` + Docker's DNS (127.0.0.11) means replicas added with
#  `docker compose up --scale agent-database=3` are picked up
#  automatically (Nginx >= 1.27.3).
# =====================================================================

# Workers run as root inside the container: nested Docker in Codespaces
# (storage on /tmp) denies the unprivileged nginx user. Harmless elsewhere.
user root;
worker_processes auto;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    resolver      127.0.0.11 valid=10s ipv6=off;

    # Access log records which replica served each request -> LB evidence
    # chaos switch: which port each whitelisted service listens on
    map $chaos_svc $chaos_port {
        ~^web    8080;
        default  8000;
    }

    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr up_time=$upstream_response_time total=$request_time';
    access_log /var/log/nginx/access.log lb;

    # Basic abuse protection for the public API (the website port is left
    # unlimited on purpose so you can load-test it).
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

    # ---------------------------------------------------------------- tiers
    upstream web_pool {
        zone web_pool 64k;
        least_conn;                       # leaky replicas get slow -> fewer new conns
        # max_fails=0: a 503 (overloaded / standby / crashed replica) is retried on the next
        # replica, but never takes a replica out of the pool -- otherwise an overload would
        # cascade into "no live upstreams" for every shopper.
        server web1:8080 resolve max_fails=0;
        server web2:8080 resolve max_fails=0;
        server web3:8080 resolve max_fails=0;
        server web4:8080 resolve max_fails=0;   # standby until scale-out
        keepalive 32;
    }

    upstream coord_pool {
        zone coord_pool 64k;
        least_conn;                       # analyses are long-running LLM jobs
        server coord1:8000 resolve max_fails=2 fail_timeout=15s;
        server coord2:8000 resolve max_fails=2 fail_timeout=15s;
    }

    upstream single_pool {
        zone single_pool 64k;
        server single-agent:8000 resolve;
    }

    upstream agent_frontend { zone agent_frontend 64k; least_conn; server agent-frontend:8000 resolve; }
    upstream agent_server   { zone agent_server 64k;   least_conn; server agent-server:8000 resolve; }
    upstream agent_database { zone agent_database 64k; least_conn; server agent-database:8000 resolve; }
    upstream agent_users    { zone agent_users 64k;    least_conn; server agent-users:8000 resolve; }

    upstream llm_pool {
        zone llm_pool 64k;
        least_conn;                       # a CPU-bound model: send work to the idle one
        server ollama1:11434 resolve max_fails=2 fail_timeout=20s;
        server ollama2:11434 resolve max_fails=2 fail_timeout=20s;
    }

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 5s;

    # ------------------------------------------------- :80 public gateway
    server {
        listen 80;
        server_name _;

        add_header X-Upstream $upstream_addr always;

        root /usr/share/nginx/html;

        # The shop (static SPA). /ops/ is the ops console.
        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        location /ops/ {
            index index.html;
        }

        # Shop API -> website replicas. A crashed replica (connection error or
        # 502/503) is retried on the next one, even for POST sign-ins/checkouts,
        # because a 503 means the request never reached the app.
        location /shop-api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://web_pool/;
        }

        # Fault injection for the resilience experiments and the ops console.
        location ~ ^/chaos/(?<chaos_svc>web1|web2|web3|web4|coord1|coord2|single-agent|agent-frontend|agent-server|agent-database|agent-users)/(?<chaos_op>down|up|status)$ {
            proxy_pass http://$chaos_svc:$chaos_port/chaos/$chaos_op;
        }

        location /api/multi/ {
            limit_req zone=api burst=60 nodelay;
            # analyses only read telemetry, so a crashed replica (503) is safely retried on the next one
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_read_timeout 900s;
            proxy_pass http://coord_pool/;
        }

        location /api/single/ {
            limit_req zone=api burst=60 nodelay;
            # analyses only read telemetry, so a crashed replica (503) is safely retried on the next one
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_read_timeout 900s;
            proxy_pass http://single_pool/;
        }

        location = /lb/status {
            stub_status;
        }

        location = /lb/health {
            default_type application/json;
            return 200 '{"gateway":"up"}';
        }
    }

    # ------------------------------------------- :8080 website load balancer
    server {
        listen 8080;
        add_header X-Upstream $upstream_addr always;
        location / {
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_pass http://web_pool;
        }
    }

    # ---------------------------------------------- :8090 internal agent tier
    server {
        listen 8090;
        add_header X-Upstream $upstream_addr always;
        proxy_read_timeout 600s;
        location /agents/frontend/ { proxy_pass http://agent_frontend/; }
        location /agents/server/   { proxy_pass http://agent_server/; }
        location /agents/database/ { proxy_pass http://agent_database/; }
        location /agents/users/    { proxy_pass http://agent_users/; }
    }

    # ---------------------------------------------- :11434 internal LLM tier
    server {
        listen 11434;
        add_header X-Upstream $upstream_addr always;
        client_max_body_size 10m;
        proxy_read_timeout 600s;
        location / {
            proxy_pass http://llm_pool;
        }
    }
}
