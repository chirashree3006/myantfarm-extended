# =====================================================================
#  MyAntFarm-Extended -- full stack
#
#     docker compose up -d --build        # start everything
#     open http://localhost                # the shop
#     open http://localhost/ops/           # ops console
#     http://localhost:8080                # load-balanced demo website
#
#  Tiers (all load balanced by the single `gateway` Nginx):
#     web1..web3        "Side B" record shop replicas (system under observation)
#     agent-*           4 specialist agents          (scale with --scale)
#     coord1, coord2    coordinator replicas
#     single-agent      single-agent baseline
#     ollama1, ollama2  TinyLlama inference replicas
# =====================================================================

x-web: &web
  build: ./demo-website
  image: myantfarm/sideb-web:latest
  restart: unless-stopped
  volumes:
    - shop_data:/data            # shared users / products / orders (SQLite, WAL)
  environment: &webenv
    POOL_SIZE: "10"
    JWT_SECRET: "${JWT_SECRET:-change-me-please}"
    GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"

x-py: &py
  build: ./multi-agent
  image: myantfarm/services:latest
  restart: unless-stopped
  environment: &pyenv
    DEMO_TARGETS: "http://web1:8080,http://web2:8080,http://web3:8080,http://web4:8080"
    DEMO_LB_URL: "http://gateway:8080"
    OLLAMA_URLS: "http://gateway:11434"
    MODEL: "${MODEL:-tinyllama}"
    LLM_MAX_CONCURRENCY: "${LLM_MAX_CONCURRENCY:-4}"
    LLM_TIMEOUT_S: "${LLM_TIMEOUT_S:-240}"
    LLM_DISABLED: "${LLM_DISABLED:-0}"
    LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.7}"
    AGENT_LLM_BUDGET_S: "${AGENT_LLM_BUDGET_S:-25}"
    SYNTH_LLM_BUDGET_S: "${SYNTH_LLM_BUDGET_S:-15}"
    AGENT_FRONTEND_URL: "http://gateway:8090/agents/frontend"
    AGENT_SERVER_URL: "http://gateway:8090/agents/server"
    AGENT_DATABASE_URL: "http://gateway:8090/agents/database"
    AGENT_USERS_URL: "http://gateway:8090/agents/users"

x-ollama: &ollama
  image: ollama/ollama:latest
  restart: unless-stopped
  entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /entrypoint.sh > /tmp/ep.sh && sh /tmp/ep.sh"]
  volumes:
    - ollama_models:/root/.ollama
    - ./ollama/entrypoint.sh:/entrypoint.sh:ro
  environment:
    MODEL: "${MODEL:-tinyllama}"
    OLLAMA_NUM_PARALLEL: "2"
    OLLAMA_MAX_LOADED_MODELS: "1"
    OLLAMA_KEEP_ALIVE: "24h"
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/ready"]
    interval: 10s
    timeout: 3s
    retries: 60
    start_period: 30s

services:
  # ------------------------------------------------------------ gateway
  gateway:
    build: ./gateway
    image: myantfarm/gateway:latest
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${SITE_PORT:-8080}:8080"

  # --------------------------------------------- system under observation
  web1: { <<: *web, environment: { <<: *webenv, INSTANCE_ID: web1 } }
  web2: { <<: *web, environment: { <<: *webenv, INSTANCE_ID: web2 } }
  web3: { <<: *web, environment: { <<: *webenv, INSTANCE_ID: web3 } }
  # standby replica: in the pool but refusing shop traffic until "scale_out" activates it
  web4: { <<: *web, environment: { <<: *webenv, INSTANCE_ID: web4, STANDBY: "1" } }

  # ------------------------------------------------- specialist agents
  agent-frontend:
    <<: *py
    command: ["uvicorn", "services.agent_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: { <<: *pyenv, AGENT_ROLE: frontend, INSTANCE_ID: agent-frontend }
  agent-server:
    <<: *py
    command: ["uvicorn", "services.agent_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: { <<: *pyenv, AGENT_ROLE: server, INSTANCE_ID: agent-server }
  agent-database:
    <<: *py
    command: ["uvicorn", "services.agent_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: { <<: *pyenv, AGENT_ROLE: database, INSTANCE_ID: agent-database }
  agent-users:
    <<: *py
    command: ["uvicorn", "services.agent_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: { <<: *pyenv, AGENT_ROLE: users, INSTANCE_ID: agent-users }

  # ------------------------------------------------- coordinators (x2)
  coord1:
    <<: *py
    command: ["uvicorn", "services.coordinator_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: { <<: *pyenv, INSTANCE_ID: coord1 }
  coord2:
    <<: *py
    command: ["uvicorn", "services.coordinator_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: { <<: *pyenv, INSTANCE_ID: coord2 }

  # ------------------------------------------------- single-agent baseline
  single-agent:
    <<: *py
    command: ["uvicorn", "services.single_agent_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: { <<: *pyenv, INSTANCE_ID: single-agent }

  # ------------------------------------------------- TinyLlama (x2)
  ollama1:
    <<: *ollama
  ollama2:
    <<: *ollama
    depends_on:
      ollama1: { condition: service_healthy }   # ollama1 pulls the model first

  # ------------------------------------------------- HTTPS (cloud, for Google sign-in)
  # docker compose --profile tls up -d   with DOMAIN=<you>.duckdns.org and GATEWAY_PORT=8000 in .env
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:-localhost}", "--to", "gateway:80"]
    volumes:
      - caddy_data:/data

volumes:
  ollama_models:
  shop_data:
  caddy_data:
